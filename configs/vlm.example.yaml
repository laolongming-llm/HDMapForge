# OpenAI-compatible vision endpoint, including compatible Qwen deployments.
# Choose an available fixed model snapshot after gold-set evaluation.
provider:
  base_url: https://YOUR_PROVIDER/v1
  model: YOUR_EVALUATED_VISION_MODEL
  api_key_env: HDMAPFORGE_API_KEY
  cache_path: runs/vlm.sqlite
  max_requests: 2000  # Includes retries; no automatic paid fine-tuning.
  retries: 2
  timeout_s: 90
  enabled_types: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]  # JD2 deferred; JD4 retained.
runtime:
  sampling_step_m: 2.0
  boundary_tolerance_m: 0.25
  direction_confirmed: false
  model_validated: false
